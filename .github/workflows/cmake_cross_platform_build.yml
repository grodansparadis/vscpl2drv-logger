name: CMake Cross-Platform Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cpack_generators: "TGZ;DEB"
          - name: windows
            os: windows-latest
            cpack_generators: "ZIP;NSIS"
          - name: macos
            os: macos-latest
            cpack_generators: "TGZ"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev libssl-dev pandoc ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install expat openssl pandoc ninja
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"
          echo "EXPAT_ROOT_DIR=$(brew --prefix expat)" >> "$GITHUB_ENV"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install pandoc nsis -y

      - name: Install vcpkg packages (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install expat:x64-windows openssl:x64-windows pthreads:x64-windows dlfcn-win32:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_INSTALL_PREFIX="/usr/local" \
            -DVSCP_PATH="third-party/vscp" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR:-}" \
            -DEXPAT_ROOT_DIR="${EXPAT_ROOT_DIR:-}"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:CMAKE_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET="x64-windows" `
            -DVSCP_PATH="third-party/vscp"

      - name: Build
        shell: bash
        run: cmake --build build --config "$BUILD_TYPE" --parallel

      - name: Install into staging
        shell: bash
        run: DESTDIR="$PWD/stage" cmake --install build --config "$BUILD_TYPE"

      - name: Create packages (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          IFS=';' read -r -a generators <<< "${{ matrix.cpack_generators }}"
          for gen in "${generators[@]}"; do
            cpack --config build/CPackConfig.cmake -G "$gen"
          done

      - name: Create packages (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $generators = "${{ matrix.cpack_generators }}" -split ';'
          foreach ($gen in $generators) {
            cpack --config build/CPackConfig.cmake -G $gen
          }

      - name: Upload install artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-logger-${{ matrix.name }}
          path: |
            stage/**
            *.deb
            *.rpm
            *.tar.gz
            *.tgz
            *.zip
            *.exe
            *.dmg
          if-no-files-found: error
          retention-days: 30
